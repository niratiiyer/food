name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leftover_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leftover_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t leftover-backend .
      - name: Build frontend image
        run: docker build -t leftover-frontend ./frontend
      - name: Smoke test the stack
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/listings && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/ > /dev/null
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      # On pushes to main, publish the images to GitHub Container Registry (ghcr.io)
      # so a cloud host like Azure Container Apps can pull them.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for name in leftover-backend leftover-frontend; do
            for tag in latest ${{ github.sha }}; do
              docker tag $name ghcr.io/$OWNER/$name:$tag
              docker push ghcr.io/$OWNER/$name:$tag
            done
          done
