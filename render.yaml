# Render "Blueprint": tells Render to create the website and the database together.
# In Render: New > Blueprint > pick this repo. See docs/GUIDE.md, Part 4.
services:
  - type: web
    name: leftover
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: leftover-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TIMEZONE
        value: America/New_York
      - key: HOLD_MINUTES
        value: "15"
      - key: ALERT_BATCH_SIZE
        value: "25"
      - key: ALLOWED_EMAIL_DOMAIN
        sync: false   # you type this in on Render, e.g. yourschool.edu
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BASE_URL
        sync: false   # e.g. https://leftover.onrender.com

databases:
  - name: leftover-db
    plan: free
